<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Journey</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Mood Journey</h2>
                <button class="new-btn" id="newBtn" title="New Journey">New Journey</button>
            </div>

            <div class="search-bar">
                <span class="search-icon">Search</span>
                <input type="text" id="searchInput" placeholder="Search">
            </div>
            <ul class="entry-nav" id="entryNav"></ul>
        </aside>

        <main class="main">
            <input type="text" id="tittleInput" class="title-input" placeholder="Untitled">
            <div class="meta-row">
                <span class="today-date" id="todayDate"></span>
                <select id="weatherSelect" class="weather-select">
                    <option value="Sunny">☀️</option>
                    <option value="Cloudy">⛅</option>
                    <option value="Cloud">☁️</option>
                    <option value="Rain">🌧️</option>
                    <option value="Snow">❄</option>
                </select>
            </div>
            <div class="emoji-row" id="emojiRow">
                <button class="emoji-btn" data-emoji="😊" data-label="Happy">😊</button>
                <button class="emoji-btn" data-emoji="😢" data-label="Sad">😢</button>
                <button class="emoji-btn" data-emoji="😠" data-label="Angry">😠</button>
                <button class="emoji-btn" data-emoji="😰" data-label="Concerned">😰</button>
                <button class="emoji-btn" data-emoji="😌" data-label="Chill">😌</button>
            </div>

            <textarea id="diaryText" class="diary-text" placeholder="Write about Today's Feeling"></textarea>
            <div class="bottom-row">
                <span class="hint" id="fromHint"></span>
                <button class="btn" id="saveBtn">Save</button>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
